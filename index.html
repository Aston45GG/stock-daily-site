 for(let i=0;i<5;i++){let value=min+(max-min)*i/4;s+=`<line x1="65" x2="920" y1="${y(value)}" y2="${y(value)}" stroke="#e2e8f0"/><text x="58" y="${y(value)+4}" text-anchor="end">${num(value)}</text>`}
 visible.forEach((b,i)=>{let color=b.close>=b.open?'#d14d5b':'#098a80';s+=`<g><title>${b.date} 開 ${num(b.open)} 高 ${num(b.high)} 低 ${num(b.low)} 收 ${num(b.close)} 量 ${num(b.volume)}股</title><line x1="${x(i)}" x2="${x(i)}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${color}"/><rect x="${x(i)-w/2}" y="${Math.min(y(b.open),y(b.close))}" width="${w}" height="${Math.max(1,Math.abs(y(b.open)-y(b.close)))}" fill="${color}"/><rect x="${x(i)-w/2}" y="${355-b.volume/volume*65}" width="${w}" height="${b.volume/volume*65}" fill="${color}" opacity=".45"/></g>`;if(i===0||i===visible.length-1||i===Math.floor(visible.length/2))s+=`<text x="${x(i)}" y="378" text-anchor="middle">${b.date}</text>`});
 for(const [key,color] of [['ma5','#d29326'],['ma20','#4272df'],['ma60','#9762c3']]){let points=mas.map((m,i)=>m[key]==null?null:`${x(i)},${y(m[key])}`).filter(Boolean);s+=`<polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8"/>`}
 return s+'</svg><p class="legend">紅 K：收盤 ≥ 開盤；綠 K：收盤 &lt; 開盤。金線 MA5、藍線 MA20、紫線 MA60。下方成交量單位為股；滑鼠指向 K 棒可看明細。原始未還原價格，除權息／分割會影響均線。</p>';
}
function showMarket(){
 document.getElementById('title').textContent='收盤行情總表';document.getElementById('subtitle').textContent='十檔研究股票 · 日 K · 三大法人 · 融資融券';document.getElementById('basis').textContent='最近檢查：'+(MARKET.checked||'尚未更新')+'。依各市場收盤滿兩小時後更新；籌碼未公布時保留舊日期。';
 document.getElementById('tabs').innerHTML='';document.querySelectorAll('#groups button').forEach(b=>b.classList.remove('active'));document.getElementById('marketNav').classList.add('active');
 const c=ALL.find(c=>c.symbol===marketSymbol),item=MARKET.stocks[marketSymbol]||{},bars=item.bars||[],last=bars.at(-1),inst=item.inst||{},margin=item.margin||{};
 let output='<section class="panel"><h2>台股</h2><p class="muted">股價、法人與資券分別標示日期。買賣超以張顯示（原始股數 ÷ 1000）；缺值為 —，不當成零。</p>';
 function overview(companies){return table(['公司','行情日期','收盤','漲跌%','成交量（股）','法人日期','外資（張）','投信（張）','自營商（張）','狀態'],companies.map(c=>{let d=MARKET.stocks[c.symbol]||{},b=d.bars||[],l=b.at(-1),p=b.at(-2),f=d.inst||{};return [`<button class="company-button" data-market-stock="${c.symbol}">${esc(c.name)} ${c.symbol}</button>`,esc(d.priceDate),num(l?.close)+' '+c.currency,p&&l?pct(l.close/p.close-1):'—',num(l?.volume),c.symbol==='SIMO'?'不適用':esc(f.date),num(f.foreign),num(f.trust),num(f.dealer),esc([d.priceStatus||'尚未下載',...(c.symbol==='SIMO'?[]:[d.instStatus,d.marginStatus])].filter(Boolean).join(' / '))]}))}
 output+=overview(ALL.filter(c=>c.symbol!=='SIMO'))+'</section><section class="panel"><h2>美股</h2>'+overview(ALL.filter(c=>c.symbol==='SIMO'))+'<p class="muted">慧榮採 USD／ADS，使用美股交易日期。台灣三大法人與融資融券欄位不適用。</p></section>';
 output+=`<section class="panel" id="marketDetail"><div class="toolbar"><h2>${esc(c.name)} ${c.symbol}</h2><select id="marketCompany" aria-label="選擇日K公司">${ALL.map(s=>`<option value="${s.symbol}" ${s.symbol===marketSymbol?'selected':''}>${s.name}</option>`).join('')}</select><select id="marketRange" aria-label="日K顯示筆數">${[30,60,120].map(n=>`<option value="${n}" ${n===marketDays?'selected':''}>最近 ${n} 筆</option>`).join('')}</select></div><p>行情日期 ${esc(item.priceDate)}　收盤 ${num(last?.close)} ${c.currency}</p>${candleChart(bars)}<p class="muted">行情：Yahoo Finance 公開日 K（補充來源）。${link(item.priceSource)}</p></section>`;
 if(c.symbol!=='SIMO')output+=`<div class="grid"><section class="panel"><h2>三大法人買賣超</h2><p class="muted">${esc(inst.date)} · ${esc(item.instStatus||'待更新')} · 單位：張</p>${table(['外資及外資自營商','投信','自營商','合計'],[[num(inst.foreign),num(inst.trust),num(inst.dealer),num(inst.total)]])}${link(inst.source)}</section><section class="panel"><h2>融資融券</h2><p class="muted">${esc(margin.date)} · ${esc(item.marginStatus||'待更新')} · 單位：張</p>${table(['項目','餘額','較前日增減'],[['融資',num(margin.financing),num(margin.financingChange)],['融券',num(margin.short),num(margin.shortChange)]])}${link(margin.source)}</section></div>`;
 output+=`<section class="panel"><h2>研究估值參考</h2><p>Excel 研究日 2026-09-30；未來四季 EPS ${num(c.eps)}，原表目標價平均 ${num(c.target)} ${c.currency}。</p><p>以目前收盤價計算的 NTM P/E：${last&&c.eps>0?num(last.close/c.eps)+' 倍':'—'}。EPS 沿用原表預估，並非每日自動重估。</p></section>`;
 document.getElementById('content').innerHTML=output;document.querySelectorAll('[data-market-stock]').forEach(b=>b.onclick=()=>{marketSymbol=b.dataset.marketStock;showMarket();document.getElementById('marketDetail').scrollIntoView({behavior:'smooth'})});document.getElementById('marketCompany').onchange=e=>{marketSymbol=e.target.value;showMarket()};document.getElementById('marketRange').onchange=e=>{marketDays=+e.target.value;showMarket()};
 document.querySelector('footer').textContent='研究內容來自原 Excel；行情與籌碼為獨立收盤資料。研究預估非保證獲利，資料日期請以各欄位為準。';
}
const researchDraw=draw;
draw=function(){researchDraw();const button=document.createElement('button');button.id='marketNav';button.textContent='股票總表 · 收盤行情';button.onclick=showMarket;document.getElementById('groups').prepend(button)};
draw();showMarket();
</script></body></html>
