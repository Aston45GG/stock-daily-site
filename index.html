function targetDate(value){
 const match=String(value??'').trim().match(/^(\d{4})[/-](\d{1,2})(?:[/-](\d{1,2}))?$/);
 if(!match)return null;
 const year=+match[1],month=+match[2],day=match[3]?+match[3]:1;
 const time=Date.UTC(year,month-1,day),date=new Date(time);
 if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return null;
 return {time,monthOnly:!match[3]};
}
function sortedTargets(targets){
 return [...targets].sort((a,b)=>(targetDate(a.date)?.time??Infinity)-(targetDate(b.date)?.time??Infinity));
}
function targetChart(targets,price){
 const points=sortedTargets(targets).map(t=>({...t,parsed:targetDate(t.date)})).filter(t=>t.parsed&&Number.isFinite(t.price));
 if(!points.length)return '<p>沒有可依日期繪製的目標價資料；請查看下方原始紀錄。</p>';
 const start=points[0].parsed.time,end=points.at(-1).parsed.time;
 const low=Math.min(0,...points.map(t=>t.price),price??Infinity),high=Math.max(...points.map(t=>t.price),price??0)*1.12||1;
 const x=time=>start===end?320:80+(time-start)/(end-start)*480;
 const y=value=>235-(value-low)/(high-low)*195;
 const label=time=>new Date(time).toISOString().slice(0,10).replaceAll('-','/');
 let svg='<svg class="target-date-chart" viewBox="0 0 640 310" role="img" aria-label="目標價日期分布：橫軸為日期，縱軸為目標價">';
 for(let i=0;i<5;i++){
  const value=low+(high-low)*i/4;

 }
 const ticks=start===end?[start]:Array.from({length:5},(_,i)=>start+(end-start)*i/4);
 for(const time of ticks){
  svg+=`<line x1="${x(time)}" x2="${x(time)}" y1="235" y2="243" stroke="#94a3b8"/><text x="${x(time)}" y="264" text-anchor="middle">${label(time)}</text>`;
 }

 for(const point of points){
  const title=`${point.date}${point.parsed.monthOnly?'（僅有月份，以月初定位）':''} / ${point.source} / ${point.price}`;
  svg+=`<circle data-target-date="${esc(point.date)}" cx="${x(point.parsed.time)}" cy="${y(point.price)}" r="6" fill="${point.parsed.monthOnly?'white':'#245bdd'}" stroke="#245bdd" stroke-width="2" tabindex="0" aria-label="${esc(title)}"><title>${esc(title)}</title></circle>`;
 }
 svg+='</svg>';
 if(points.some(p=>p.parsed.monthOnly))svg+='<p class="legend">空心點：原表僅記載月份，暫以該月 1 日定位，不代表確切發布日。</p>';
 if(points.length<targets.length)svg+='<p class="legend">部分紀錄缺少有效日期或價格，未繪入圖中；仍保留於下表。</p>';
 return svg;
}

function annualEpsChart(rows,unit){
 const available=rows.filter(r=>Number.isFinite(r.eps));
 if(!available.length)return '<p class="empty">尚無全年 EPS 實績資料。</p>';
 const lo=Math.min(0,...available.map(r=>r.eps)),hi=Math.max(0,...available.map(r=>r.eps));
 const padding=(hi-lo||1)*0.16,low=lo-padding,high=hi+padding;
 const y=v=>235-(v-low)/(high-low)*190;
 let svg=`<svg class="annual-eps-chart" viewBox="0 0 640 295" role="img" aria-label="歷年全年 EPS 實績，2020 年起，單位 ${esc(unit)}">`;
 for(let i=0;i<5;i++){const v=low+(high-low)*i/4;svg+=`<line x1="65" x2="600" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="57" y="${y(v)+4}" text-anchor="end">${num(v)}</text>`;}
 svg+=`<line x1="65" x2="600" y1="${y(0)}" y2="${y(0)}" stroke="#94a3b8" stroke-width="1.5"/>`;
 rows.forEach((r,i)=>{const x=100+i*455/Math.max(1,rows.length-1);if(Number.isFinite(r.eps)){
  const title=`${r.year} 全年 EPS ${r.eps} ${unit}`;
  svg+=`<rect data-annual-year="${r.year}" x="${x-20}" y="${Math.min(y(0),y(r.eps))}" width="40" height="${Math.abs(y(r.eps)-y(0))}" fill="${r.eps<0?'#b6454b':'#007e80'}" rx="3"><title>${esc(title)}</title></rect><text x="${x}" y="${y(r.eps)+(r.eps<0?18:-10)}" text-anchor="middle">${num(r.eps)}</text>`;
 }else svg+=`<text x="${x}" y="${y(0)-10}" text-anchor="middle">—</text>`;
 svg+=`<text x="${x}" y="265" text-anchor="middle">${r.year}</text>`;});
 return svg+'<text x="330" y="288" text-anchor="middle">年度</text></svg>';
}

const ALL=DATA.flatMap(g=>g.companies);
let marketSymbol='2330',marketDays=60;
function candleChart(bars){
 const visible=bars.slice(-marketDays);if(!visible.length)return '<p class="notice">日 K 尚未取得，不以研究基準價代替。</p>';
 const mas=bars.map((b,i)=>Object.fromEntries([5,20,60].map(n=>['ma'+n,i+1>=n?bars.slice(i-n+1,i+1).reduce((a,b)=>a+b.close,0)/n:null]))).slice(-marketDays);
 const vals=visible.flatMap((b,i)=>[b.low,b.high,...Object.values(mas[i]).filter(x=>x!=null)]);
 const min=Math.min(...vals)*.97,max=Math.max(...vals)*1.03,volume=Math.max(...visible.map(b=>b.volume),1);
 const x=i=>65+(i+.5)*850/visible.length,y=v=>260-(v-min)/(max-min)*220,w=Math.max(2,550/visible.length);
 let s='<svg viewBox="0 0 980 400" role="img" aria-label="日 K 線與成交量">';
 for(let i=0;i<5;i++){let value=min+(max-min)*i/4;s+=`<line x1="65" x2="920" y1="${y(value)}" y2="${y(value)}" stroke="#e2e8f0"/><text x="58" y="${y(value)+4}" text-anchor="end">${num(value)}</text>`}
 visible.forEach((b,i)=>{let color=b.close>=b.open?'#d14d5b':'#098a80';s+=`<g><title>${b.date} 開 ${num(b.open)} 高 ${num(b.high)} 低 ${num(b.low)} 收 ${num(b.close)} 量 ${num(b.volume)}股</title><line x1="${x(i)}" x2="${x(i)}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${color}"/><rect x="${x(i)-w/2}" y="${Math.min(y(b.open),y(b.close))}" width="${w}" height="${Math.max(1,Math.abs(y(b.open)-y(b.close)))}" fill="${color}"/><rect x="${x(i)-w/2}" y="${355-b.volume/volume*65}" width="${w}" height="${b.volume/volume*65}" fill="${color}" opacity=".45"/></g>`;if(i===0||i===visible.length-1||i===Math.floor(visible.length/2))s+=`<text x="${x(i)}" y="378" text-anchor="middle">${b.date}</text>`});
 for(const [key,color] of [['ma5','#d29326'],['ma20','#4272df'],['ma60','#9762c3']]){let points=mas.map((m,i)=>m[key]==null?null:`${x(i)},${y(m[key])}`).filter(Boolean);s+=`<polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8"/>`}
 return s+'</svg><p class="legend">紅 K：收盤 ≥ 開盤；綠 K：收盤 &lt; 開盤。金線 MA5、藍線 MA20、紫線 MA60。下方成交量單位為股；滑鼠指向 K 棒可看明細。原始未還原價格，除權息／分割會影響均線。</p>';
}
function showMarket(){
 document.getElementById('title').textContent='收盤行情總表';document.getElementById('subtitle').textContent=`${ALL.length} 檔研究股票 · 日 K · 三大法人 · 融資融券`;document.getElementById('basis').textContent='最近檢查：'+(MARKET.checked||'尚未更新')+'。依各市場收盤滿兩小時後更新；籌碼未公布時保留舊日期。';
 document.getElementById('tabs').innerHTML='';document.querySelectorAll('#groups button').forEach(b=>b.classList.remove('active'));document.getElementById('marketNav').classList.add('active');
 const c=ALL.find(c=>c.symbol===marketSymbol),item=MARKET.stocks[marketSymbol]||{},bars=item.bars||[],last=bars.at(-1),inst=item.inst||{},margin=item.margin||{};
 let output='<section class="panel"><h2>台股</h2><p class="muted">股價、法人與資券分別標示日期。買賣超以張顯示（原始股數 ÷ 1000）；缺值為 —，不當成零。</p>';
 function overview(companies){return table(['公司','行情日期','收盤','漲跌%','成交量（股）','法人日期','外資（張）','投信（張）','自營商（張）','狀態'],companies.map(c=>{let d=MARKET.stocks[c.symbol]||{},b=d.bars||[],l=b.at(-1),p=b.at(-2),f=d.inst||{};return [`<button class="company-button" data-market-stock="${c.symbol}">${esc(c.name)} ${c.symbol}</button>`,esc(d.priceDate),num(l?.close)+' '+c.currency,p&&l?pct(l.close/p.close-1):'—',num(l?.volume),c.symbol==='SIMO'?'不適用':esc(f.date),num(f.foreign),num(f.trust),num(f.dealer),esc([d.priceStatus||'尚未下載',...(c.symbol==='SIMO'?[]:[d.instStatus,d.marginStatus])].filter(Boolean).join(' / '))]}))}
 output+=overview(ALL.filter(c=>c.symbol!=='SIMO'))+'</section><section class="panel"><h2>美股</h2>'+overview(ALL.filter(c=>c.symbol==='SIMO'))+'<p class="muted">慧榮採 USD／ADS，使用美股交易日期。台灣三大法人與融資融券欄位不適用。</p></section>';
 output+=`<section class="panel" id="marketDetail"><div class="toolbar"><h2>${esc(c.name)} ${c.symbol}</h2><select id="marketCompany" aria-label="選擇日K公司">${ALL.map(s=>`<option value="${s.symbol}" ${s.symbol===marketSymbol?'selected':''}>${s.name}</option>`).join('')}</select><select id="marketRange" aria-label="日K顯示筆數">${[30,60,120].map(n=>`<option value="${n}" ${n===marketDays?'selected':''}>最近 ${n} 筆</option>`).join('')}</select></div><p>行情日期 ${esc(item.priceDate)}　收盤 ${num(last?.close)} ${c.currency}</p>${candleChart(bars)}<p class="muted">行情：Yahoo Finance 公開日 K（補充來源）。${link(item.priceSource)}</p></section>`;
 if(c.symbol!=='SIMO')output+=`<div class="grid"><section class="panel"><h2>三大法人買賣超</h2><p class="muted">${esc(inst.date)} · ${esc(item.instStatus||'待更新')} · 單位：張</p>${table(['外資及外資自營商','投信','自營商','合計'],[[num(inst.foreign),num(inst.trust),num(inst.dealer),num(inst.total)]])}${link(inst.source)}</section><section class="panel"><h2>融資融券</h2><p class="muted">${esc(margin.date)} · ${esc(item.marginStatus||'待更新')} · 單位：張</p>${table(['項目','餘額','較前日增減'],[['融資',num(margin.financing),num(margin.financingChange)],['融券',num(margin.short),num(margin.shortChange)]])}${link(margin.source)}</section></div>`;
 output+=`<section class="panel"><h2>研究估值參考</h2><p>${c.eps==null?'尚未取得未來四季研究預估；':'Excel 研究日 2026-09-30；'}未來四季 EPS ${num(c.eps)}，研究目標價平均 ${num(c.target)} ${c.currency}。</p><p>以目前收盤價計算的 NTM P/E：${last&&c.eps>0?num(last.close/c.eps)+' 倍':'—'}。EPS 沿用原表預估，並非每日自動重估。</p></section>`;
 document.getElementById('content').innerHTML=output;document.querySelectorAll('[data-market-stock]').forEach(b=>b.onclick=()=>{marketSymbol=b.dataset.marketStock;showMarket();document.getElementById('marketDetail').scrollIntoView({behavior:'smooth'})});document.getElementById('marketCompany').onchange=e=>{marketSymbol=e.target.value;showMarket()};document.getElementById('marketRange').onchange=e=>{marketDays=+e.target.value;showMarket()};
 document.querySelector('footer').textContent='研究內容來自原 Excel；行情與籌碼為獨立收盤資料。研究預估非保證獲利，資料日期請以各欄位為準。';
}
const researchDraw=draw;
draw=function(){researchDraw();const button=document.createElement('button');button.id='marketNav';button.textContent='股票總表 · 收盤行情';button.onclick=showMarket;document.getElementById('groups').prepend(button)};
draw();showMarket();
</script></body></html>
